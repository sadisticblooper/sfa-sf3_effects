name: Zip all frame archives

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zip-frames
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /.github/workflows/zip-frames.yml
            /zip_frames.py
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - name: Rezip every effect (SF3 + SFA) and commit over existing
        run: |
          set -euo pipefail
          git config user.name "VFX Pipeline"
          git config user.email "vfx-pipeline@local"

          git ls-tree -d --name-only HEAD SF3/ SFA/ \
            | sed 's#/$##' | sort > all_dirs.txt
          TOTAL=$(wc -l < all_dirs.txt)
          echo "effect dirs: $TOTAL"
          echo "  SF3: $(grep -c '^SF3/' all_dirs.txt || true)"
          echo "  SFA: $(grep -c '^SFA/' all_dirs.txt || true)"

          split -l 100 all_dirs.txt chunk_
          DONE=0
          for f in chunk_*; do
            {
              awk '{print "/" $0 "/"}' "$f"
              echo "/.github/workflows/zip-frames.yml"
              echo "/zip_frames.py"
            } > patterns.txt
            git sparse-checkout set --no-cone $(cat patterns.txt)

            cp "$f" changed_dirs.txt

            while read -r d; do
              rm -f "$d/frames.zip"
            done < changed_dirs.txt

            python zip_frames.py --repo . --dirs changed_dirs.txt --no-commit

            if [ -s zip_paths.txt ]; then
              git add -f -- $(cat zip_paths.txt)
              if ! git diff --cached --quiet; then
                git commit -m "chore: rezip frame archives (SF3 + SFA)"
                git push origin HEAD:refs/heads/main
              fi
            fi

            DONE=$((DONE + 100))
            echo "done: $DONE / $TOTAL"
            rm -f "$f"
          done
