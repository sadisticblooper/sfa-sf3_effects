name: Zip effect frames

on:
  push:
    branches: [main]
    paths:
      - 'SF3/**'
      - 'SFA/**'
      - '.github/workflows/zip-frames.yml'
      - 'zip_frames.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zip-frames
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      # Partial clone: tree objects only, no 2.5M-file blob download.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /.github/workflows/zip-frames.yml
            /zip_frames.py
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - name: Find changed effect dirs
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse "$SHA^")
          fi

          git diff --name-only "$BEFORE" "$SHA" -- 'SF3/**' 'SFA/**' \
            | cut -d/ -f1,2 | sort -u > changed_dirs.txt
          echo "effect dirs: $(wc -l < changed_dirs.txt)"

          # Expand sparse checkout to only the changed effect folders.
          # Leading slash on every pattern fixes the git warnings.
          {
            awk '{print "/" $0 "/"}' changed_dirs.txt
            echo "/.github/workflows/zip-frames.yml"
            echo "/zip_frames.py"
          } > patterns.txt
          git sparse-checkout set --no-cone $(cat patterns.txt)

      - name: Build frame archives
        run: python zip_frames.py --repo . --dirs changed_dirs.txt --no-commit

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "VFX Pipeline"
          git config user.email "vfx-pipeline@local"
          if [ -s zip_paths.txt ]; then
            git add -f -- $(cat zip_paths.txt)
          fi
          if git diff --cached --quiet; then
            echo "No archive changes"
          else
            git commit -m "chore: update frame archives"
            git push origin HEAD:refs/heads/main
          fi
