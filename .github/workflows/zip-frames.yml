name: Zip effect frames

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zip-frames
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /.github/workflows/zip-frames.yml
            /zip_frames.py
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - name: Pick effect dirs needing a zip
        run: |
          set -euo pipefail
         
          git ls-tree -d --name-only HEAD SF3/ SFA/ | sed 's#/$##' > all_dirs.txt
          git ls-tree -r --name-only HEAD -- SF3/ SFA/ \
            | grep '/frames.zip$' \
            | cut -d/ -f1,2 | sort -u > zipped_dirs.txt

          comm -23 <(sort all_dirs.txt) zipped_dirs.txt > needs_zip.txt
          echo "total effect dirs: $(wc -l < all_dirs.txt)"
          echo "already zipped:    $(wc -l < zipped_dirs.txt)"
          echo "still need zip:    $(wc -l < needs_zip.txt)"

          # On a real push, prioritize dirs changed by that push; otherwise backfill.
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE" "$SHA" -- 'SF3/**' 'SFA/**' \
              | cut -d/ -f1,2 | sort -u > changed_dirs.txt
          else
            : > changed_dirs.txt
          fi

          # Changed dirs that still need a zip, capped at 100 per run.
          comm -12 changed_dirs.txt needs_zip.txt > target_dirs.txt || true
          if [ ! -s target_dirs.txt ]; then
            head -100 needs_zip.txt > target_dirs.txt
          fi
          head -100 target_dirs.txt > final_dirs.txt
          mv final_dirs.txt changed_dirs.txt

          echo "effect dirs this run: $(wc -l < changed_dirs.txt)"
          cat changed_dirs.txt

          {
            awk '{print "/" $0 "/"}' changed_dirs.txt
            echo "/.github/workflows/zip-frames.yml"
            echo "/zip_frames.py"
          } > patterns.txt
          git sparse-checkout set --no-cone $(cat patterns.txt)

      - name: Build frame archives
        run: |
          python zip_frames.py --repo . --dirs changed_dirs.txt --no-commit
          echo "--- zip paths ---"
          cat zip_paths.txt

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "VFX Pipeline"
          git config user.email "vfx-pipeline@local"
          if [ -s zip_paths.txt ]; then
            git add -f -- $(cat zip_paths.txt)
          fi
          echo "--- staged ---"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "Nothing staged"
          else
            git commit -m "chore: add frame archives"
            git push origin HEAD:refs/heads/main
          fi
