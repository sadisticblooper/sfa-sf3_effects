name: Zip effect frames

on:
  push:
    branches: [main]
    paths:
      - 'SF3/**'
      - 'SFA/**'

permissions:
  contents: write

concurrency:
  group: zip-frames
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zip frames for effects changed by this push
        run: python zip_frames.py --repo . --changed-ref HEAD~1 --chunk 50
