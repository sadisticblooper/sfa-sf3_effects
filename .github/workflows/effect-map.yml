name: Build effect map

on:
  push:
    branches: [main]
    paths:
      - 'SF3/**'
      - 'SFA/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: effect-map
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate map.txt
        run: python build_effect_map.py --repo .
