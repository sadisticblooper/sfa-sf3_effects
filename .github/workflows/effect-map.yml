name: Build effect map

on:
  push:
    branches: [main]
    paths:
      - 'SF3/**'
      - 'SFA/**'
      - '.github/workflows/effect-map.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: effect-map
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      # Partial clone: fetches git tree objects only, no file blobs. The full
      # effect list lives in the tree, so ls-tree needs no checkout of 2.5M files.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: map.txt
          sparse-checkout-cone-mode: false

      - name: Build map.txt from git tree and commit
        run: |
          set -euo pipefail
          : > map.txt
          for game in SF3 SFA; do
            git ls-tree --name-only HEAD "$game" | while read -r effect; do
              echo "$effect | https://github.com/$GITHUB_REPOSITORY/tree/main/$game/$effect"
            done >> map.txt
          done
          echo "map.txt: $(wc -l < map.txt) effects"

          git config user.name "VFX Pipeline"
          git config user.email "vfx-pipeline@local"
          git add map.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs: update map.txt"
            git push origin HEAD:refs/heads/main
          fi
