name: Build effect map

on:
  push:
    branches: [main]
    paths:
      - 'SF3/**'
      - 'SFA/**'
      - '.github/workflows/effect-map.yml'
      - 'build_map_api.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: effect-map
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (just the script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: build_map_api.py
          sparse-checkout-cone-mode: false

      - name: Generate and commit map.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build_map_api.py
