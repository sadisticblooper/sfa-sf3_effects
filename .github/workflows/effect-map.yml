name: Build effect map

on:
  push:
    branches: [main]
    paths:
      - 'SF3/**'
      - 'SFA/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: effect-map
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - name: Generate map.txt and commit via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          {
            for game in SF3 SFA; do
              gh api "repos/$GITHUB_REPOSITORY/contents/$game?per_page=100" --paginate \
                --jq ".[] | select(.type == \"dir\") | \"\(.name) | https://github.com/$GITHUB_REPOSITORY/tree/main/$game/\(.name)\""
            done
          } > map.txt

          echo "map.txt lines: $(wc -l < map.txt)"

          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/map.txt?ref=main" --jq '.sha' 2>/dev/null || true)
          CONTENT=$(base64 -w0 map.txt)

          if [ -n "$SHA" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/map.txt" \
              -F message="docs: update map.txt" \
              -F content="$CONTENT" \
              -F sha="$SHA" \
              -F branch=main
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/map.txt" \
              -F message="docs: add map.txt" \
              -F content="$CONTENT" \
              -F branch=main
          fi
